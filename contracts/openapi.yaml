components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EditConflict:
      description: Someone else changed this field first; reload and retry
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: The request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: File too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMedia:
      description: Not a PDF, PNG or JPEG
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: |
        A dependency is down; try again. code is storage_unavailable (nothing was saved) or
        queue_unavailable (the upload was saved but could not be queued for processing).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ---------- Reusable core shapes ----------
    Evidence:
      type: object
      description: Where a value came from on the page.
      required: [document_id, page, line_ids]
      properties:
        document_id:
          type: string
          format: uuid
        page:
          type: integer
          minimum: 1
        line_ids:
          type: array
          description: Numbered line IDs such as "p1-L31".
          items:
            type: string
            pattern: "^p[0-9]+-L[0-9]+$"
        bbox:
          $ref: "#/components/schemas/BoundingBox"

    BoundingBox:
      type: object
      description: Box on the page image, as fractions of page width and height (0 to 1).
      required: [x0, y0, x1, y1]
      properties:
        x0: { type: number, minimum: 0, maximum: 1 }
        y0: { type: number, minimum: 0, maximum: 1 }
        x1: { type: number, minimum: 0, maximum: 1 }
        y1: { type: number, minimum: 0, maximum: 1 }

    Certainty:
      type: string
      enum: [high, medium, low]

    Severity:
      type: string
      enum: [error, warning, info]

    Flag:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          description: Stable code, e.g. DI-CHK-03 or unverified_quote.
          examples: ["DI-CHK-03"]
        severity:
          $ref: "#/components/schemas/Severity"
        message:
          type: string
          examples: ["Gross 3,070.50 minus deductions 1,036.89 is 2,033.61, not 2,083.61"]
        evidence:
          $ref: "#/components/schemas/Evidence"

    ReviewStatus:
      type: string
      enum: [unreviewed, confirmed, corrected, rejected]

    Field:
      type: object
      description: |
        One extracted value. Values are strings exactly as normalised by code (amounts as
        "2033.61", dates as "2026-07-31"); arithmetic happens in code with Decimal, never here.
      required: [name, value, original_value, certainty, flags, review_status]
      properties:
        name:
          type: string
          examples: ["net_pay_current"]
        value:
          type: [string, "null"]
        original_value:
          type: [string, "null"]
          description: The value as first extracted. Never changed by a correction.
        certainty:
          $ref: "#/components/schemas/Certainty"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/Flag"
        evidence:
          oneOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        reviewed_by:
          type: [string, "null"]
        reviewed_at:
          type: [string, "null"]
          format: date-time
        review_reason:
          type: [string, "null"]
        version:
          type: integer
          description: Incremented on every change; send it back on PATCH to detect edit conflicts.

    FieldReview:
      type: object
      required: [action, expected_version]
      properties:
        action:
          type: string
          enum: [confirm, correct, reject]
        value:
          type: string
          description: Required when action is correct.
        reason:
          type: string
          maxLength: 1000
          description: Required when action is correct or reject.
        expected_version:
          type: integer
      allOf:
        - if:
            properties:
              action:
                const: correct
          then:
            required: [value, reason]
        - if:
            properties:
              action:
                const: reject
          then:
            required: [reason]

    Job:
      type: object
      required: [id, status, progress]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          examples: ["document_processing"]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        progress:
          type: number
          minimum: 0
          maximum: 1
        stage:
          type: [string, "null"]
          examples: ["extract"]
        error:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    # ---------- Auth ----------
    Role:
      type: string
      enum: [underwriter, lm_specialist, admin]
      description: underwriter covers the loan processor or underwriter role.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
        user:
          type: object
          required: [id, name, role]
          properties:
            id:
              type: string
            name:
              type: string
            role:
              $ref: "#/components/schemas/Role"

    # ---------- Cases ----------
    Pillar:
      type: string
      enum: [underwriting, loss_mitigation]

    CaseCreate:
      type: object
      required: [title, pillar]
      properties:
        title:
          type: string
          maxLength: 200
          examples: ["Daniel Reyes — purchase"]
        pillar:
          $ref: "#/components/schemas/Pillar"

    Case:
      allOf:
        - $ref: "#/components/schemas/CaseCreate"
        - type: object
          required: [id, created_at]
          properties:
            id:
              type: string
              format: uuid
            case_ref:
              type: string
              pattern: "^(LP|LM)-[0-9]{4,}$"
              description: Human case reference; LP for underwriting, LM for loss mitigation.
              examples: ["LP-0001"]
            profile:
              oneOf:
                - $ref: "#/components/schemas/CaseProfile"
                - type: "null"
            document_count:
              type: integer
            created_at:
              type: string
              format: date-time

    CaseProfile:
      type: object
      required: [borrower_names, employment_type, reference_date]
      properties:
        borrower_names:
          type: array
          minItems: 1
          items:
