openapi: 3.1.0
info:
  title: Loan Processing and Mortgage Loss Mitigation Copilot API
  version: 0.1.0
  description: |
    Contract for Feature 1 (Document Intelligence), cases and jobs.
    Source of truth: docs/feature-design.md section 1.7 and shared pages B and D.
    Only Arindam merges changes to this file; each change goes in its own PR.

    Rules that hold across every endpoint:
    - Every case-scoped path starts with /cases/{case_id}. No endpoint takes a tenant or user ID;
      both come from the bearer token.
    - Long work (OCR, classification, extraction, analysis) runs as a background job. The
      endpoint returns 202 with a Job; the client polls GET /jobs/{job_id}.
    - Corrections never overwrite: a field keeps original_value, and every change is audited.
    - No response presents a decision. There is no approve, deny or offer anywhere in this API.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000/api/v1
    description: Local docker compose
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Seeded demo login (three roles); Cognito later with the same claims.
  - name: cases
    description: A case groups one borrower scenario's documents and results.
  - name: documents
    description: Feature 1 Document Intelligence — upload, classify, extract, review.
  - name: completeness
    description: Feature 1 completeness checklist run against the case.
  - name: jobs
    description: Background job status for long-running work.

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in as a seeded demo user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cases:
    post:
      tags: [cases]
      operationId: createCase
      summary: Create a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      tags: [cases]
      operationId: listCases
      summary: List cases visible to the caller
      parameters:
        - name: pillar
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Pillar"
      responses:
        "200":
          description: Cases
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Case"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cases/{case_id}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [cases]
      operationId: getCase
      summary: Get one case
      responses:
        "200":
          description: Case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cases/{case_id}/profile:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    put:
      tags: [cases]
      operationId: putCaseProfile
      summary: Set borrower names, employment type and reference date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseProfile"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /cases/{case_id}/overview:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [cases]
      operationId: getCaseOverview
      summary: Every document with its type, owner, period, flags and summary
      responses:
        "200":
          description: Case overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cases/{case_id}/documents:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      tags: [documents]
      operationId: uploadDocuments
      summary: Upload files; queues classification and extraction
      description: |
        Accepts PDF, PNG or JPEG. declared_type is "auto" (Auto-detect) or a document type the
        user picked. File names are stored but never sent to a model.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                declared_type:
                  oneOf:
                    - type: string
                      const: auto
                    - $ref: "#/components/schemas/DocumentType"
                  default: auto
      responses:
        "202":
          description: Documents created and a processing job queued
          content:
            application/json:
              schema:
                type: object
                required: [documents, job]
                properties:
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentSummary"
                  job:
                    $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [documents]
      operationId: listDocuments
      summary: List documents with type, status and flags
      parameters:
        - name: needs_review
          in: query
          required: false
          description: Only documents that have flagged fields
          schema:
            type: boolean
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cases/{case_id}/documents/{document_id}/extraction:
    parameters:
      - $ref: "#/components/parameters/CaseId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [documents]
      operationId: getExtraction
      summary: Fields, flags and summary of the active run
      responses:
        "200":
          description: Extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extraction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cases/{case_id}/documents/{document_id}/fields/{field_name}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
      - $ref: "#/components/parameters/DocumentId"
      - name: field_name
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
    patch:
      tags: [documents]
      operationId: reviewField
      summary: Confirm or correct a value; the original is always kept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldReview"
      responses:
        "200":
          description: Updated field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EditConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /cases/{case_id}/documents/{document_id}/type:
    parameters:
      - $ref: "#/components/parameters/CaseId"
      - $ref: "#/components/parameters/DocumentId"
    put:
      tags: [documents]
      operationId: setDocumentType
      summary: Confirm or change the document type; re-queues extraction when it changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_type]
              properties:
                doc_type:
                  $ref: "#/components/schemas/DocumentType"
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Type confirmed; no new extraction needed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
        "202":
          description: Type changed; extraction job queued
          content:
            application/json:
              schema:
                type: object
                required: [document, job]
                properties:
                  document:
                    $ref: "#/components/schemas/DocumentSummary"
                  job:
                    $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  # TODO(D3+): GET /cases/{case_id}/documents/{document_id}/pages/{page}  short-lived page image link
  # TODO(D3+): POST /cases/{case_id}/documents/{document_id}/runs          re-run a document or one stage

  /cases/{case_id}/completeness:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      tags: [completeness]
      operationId: runCompleteness
      summary: Run the configured checklist against the case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checklist_id]
              properties:
                checklist_id:
                  type: string
                  examples: ["pillar1-wage-earner@1"]
      responses:
        "200":
          description: Completeness result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletenessResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /cases/{case_id}/completeness/latest:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      tags: [completeness]
      operationId: getLatestCompleteness
      summary: The most recent completeness result
      responses:
        "200":
          description: Completeness result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletenessResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [jobs]
      operationId: getJob
      summary: Status of a background job
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------- Generated from the served API (FastAPI) on 2026-11-25 ----------
  # Income, assets, credit, hardship and budget, the underwriting report, the LM
  # recommendation, guidelines, audit and jobs. Regenerate with the script in the PR.
  /cases/{case_id}/asset-liability:
    post:
      tags:
      - assets
      summary: Run Asset Liability
      description: Queue an analysis of the case's statements. Poll the job, then read ``/latest``.
      operationId: runAssetLiabilityAnalysis
      security:
      - bearerAuth: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetRunAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/asset-liability/latest:
    get:
      tags:
      - assets
      summary: Get Latest Asset Liability
      description: 'The newest analysis: the figures with their working, the debts, the labelled lines,
        flags.'
      operationId: getLatestAssetLiabilityAnalysis
      security:
      - bearerAuth: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetAnalysisOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/asset-liability/latest/obligations/{obligation_id}:
    patch:
      tags:
      - assets
      summary: Review Obligation
      description: Include a debt in the DTI or leave it out, with a reason. The ratios recalculate at once.
      operationId: reviewObligation
      security:
      - bearerAuth: []
      parameters:
      - name: obligation_id
        in: path
        required: true
        schema:
          type: string
          title: Obligation Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObligationReviewIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetAnalysisOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/asset-liability/latest/transactions/{transaction_id}:
    patch:
      tags:
      - assets
      summary: Review Transaction
      description: Give a line another category, or mark a deposit as sourced, with a reason.
      operationId: reviewTransaction
      security:
      - bearerAuth: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          title: Transaction Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionReviewIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetAnalysisOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/audit:
    get:
      tags:
      - audit
      summary: List Case Audit
      description: A case's events, newest first. Filter by action or entity_type; page by before.
      operationId: listCaseAudit
      security:
      - bearerAuth: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Exact action name
          title: Action
        description: Exact action name
      - name: entity_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Entity Type
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Id of the last event already seen
          title: Before
        description: Id of the last event already seen
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/completeness/latest/items/{item_id}:
    patch:
      tags:
      - completeness
      summary: Override Completeness Item
      description: Override an item with a written reason (it counts as satisfied), or clear the override.
      operationId: overrideCompletenessItem
      security:
      - bearerAuth: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemOverrideIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletenessResultOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/credit-analysis:
    post:
      tags:
      - credit
      summary: Run Credit Analysis
      description: Queue an analysis of the case's credit report. Poll the job, then read ``/latest``.
      operationId: runCreditAnalysis
      security:
      - bearerAuth: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditRunAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/credit-analysis/latest:
    get:
      tags:
      - credit
      summary: Get Latest Credit Analysis
      description: 'Scores and the representative score with its method, tradelines with utilization and
        late

        payments, inquiries with their matches, derogatory items, alerts first, flags, the template

        summary, and every figure with its working.'
      operationId: getLatestCreditAnalysis
      security:
      - bearerAuth: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAnalysisOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/documents/{document_id}/pages/{page}:
    get:
      tags:
      - documents
      summary: Get Page Image
      description: A 5-minute link to the stored image of one page, and the image's width and height.
      operationId: getPageImage
      security:
      - bearerAuth: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      - name: page
        in: path
        required: true
        schema:
          type: string
          title: Page
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageImageOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/hardship-assessment:
    post:
      tags:
      - hardship
      summary: Run Hardship Reading
      description: 'Queue a reading of the case''s hardship letter. Poll the job, then read ``/latest``.
        The

        earlier reading, such as the seeded sample, stays as history.'
      operationId: runHardshipReading
      security:
      - bearerAuth: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardshipRunAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/hardship-assessment/latest:
    get:
      tags:
      - hardship
      summary: Get Latest Hardship Assessment
      description: 'The newest profile with each item''s quote, lines and check, the specialist''s confirmations,

        and the budget with its measures, consistency checks and flags.'
      operationId: getLatestHardshipAssessment
      security:
      - bearerAuth: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardshipAssessmentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/hardship-assessment/latest/budget/{line_id}:
    patch:
      tags:
      - hardship
      summary: Adjust Budget Line
      description: 'Count a different observed amount for a budget line (for example, part of it was one-off),

        with a reason, or clear an earlier adjustment. The measures update at once, with no model.'
      operationId: adjustBudgetLine
      security:
      - bearerAuth: []
      parameters:
      - name: line_id
        in: path
        required: true
        schema:
          type: string
          title: Line Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetAdjustIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardshipAssessmentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/hardship-assessment/latest/confirmations:
    put:
      tags:
      - hardship
      summary: Confirm Hardship Items
      description: 'Confirm the reading''s reason, onset, duration or intent, or correct it with a reason.
        The

        value as read stays beside the confirmation (labelled "reviewer-confirmed").'
      operationId: confirmHardshipItems
      security:
      - bearerAuth: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationsIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardshipAssessmentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cases/{case_id}/income-analysis:
    post:
      tags:
      - income
      summary: Run Income Analysis
