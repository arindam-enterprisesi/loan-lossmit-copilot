# LLM provider and model per task. Switch a task's provider here; no code change needed.
# Read by app/llm/config.py. Every result records the provider and model it used.
version: "2026-11-17.1"
label: illustrative

default_provider: anthropic
max_tokens: 16000

providers:
  anthropic:            # Claude API
    model: claude-opus-5-5
    temperature: null   # current Claude models reject sampling parameters
    options:
      effort: medium
  bedrock:              # Claude on Amazon Bedrock (Mantle endpoint); region from AWS_REGION
    model: anthropic.claude-opus-5-5   # confirm the exact model or inference-profile ID with the AWS admin
    temperature: null
    options:
      effort: medium
  gemini:               # Google Gemini API via langchain-google-genai
    model: gemini-flash-latest         # alias tracks the current Flash; pin a version before the demo
    temperature: 0
  openai:               # OpenAI via langchain-openai
    model: gpt-5.6-terra               # unverified ID; confirm with `python -m app.llm.smoke --provider openai`
    temperature: null   # reasoning models accept only the default temperature

tasks:
  smoke:
    max_tokens: 1024
    options:
      effort: low
  classify:
    max_tokens: 2048
    options:
      effort: low
  extract:
    options:
      effort: medium

embeddings:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536
