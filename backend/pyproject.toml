[project]
name = "loan-lossmit-copilot-backend"
version = "0.1.0"
description = "Backend for the Loan Processing and Mortgage Loss Mitigation Copilot"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "anthropic[bedrock]>=0.70",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-aws>=1.9.3",
    "python-dotenv>=1.2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "arq>=0.26",
    "boto3>=1.35",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.34",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
    "moto[s3]>=5.0",
    "boto3-stubs[s3]>=1.35",
    "types-python-jose>=3.3",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: calls a real model provider; skipped unless its key is set"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Keep TypeVar-style generics for readability across the team.
ignore = ["UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "pypdfium2", "pypdfium2.*", "moto", "moto.*"]
ignore_missing_imports = true
