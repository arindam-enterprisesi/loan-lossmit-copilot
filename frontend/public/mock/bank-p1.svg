<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100" role="img" aria-label="Mock bank statement, page 1 (synthetic)">
  <!-- Synthetic demo page. Positions match the bounding boxes in src/mocks/extraction.ts (fractions of 850 x 1100). -->
  <rect width="850" height="1100" fill="#ffffff"/>
  <rect x="85" y="60" width="680" height="2" fill="#10202b"/>
  <text x="85" y="95" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#10202b">HARBORLIGHT BANK</text>
  <text x="85" y="130" font-family="Arial, sans-serif" font-size="11" fill="#6f7b85" letter-spacing="1.5">CHECKING ACCOUNT STATEMENT</text>
  <text x="85" y="170" font-family="Arial, sans-serif" font-size="10" fill="#6f7b85">Account holder</text>
  <text x="206" y="170" font-family="monospace" font-size="10" fill="#10202b">Daniel Reyes</text>
  <text x="85" y="190" font-family="Arial, sans-serif" font-size="10" fill="#6f7b85">Period start</text>
  <text x="206" y="190" font-family="monospace" font-size="10" fill="#10202b">2026-09-01</text>
  <text x="85" y="212" font-family="Arial, sans-serif" font-size="10" fill="#6f7b85">Period end</text>
  <text x="206" y="212" font-family="monospace" font-size="10" fill="#10202b">2026-09-30</text>
