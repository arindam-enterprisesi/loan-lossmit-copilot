    <rect x="85" y="430" width="540" height="8" rx="2"/>
    <rect x="85" y="452" width="570" height="8" rx="2"/>
  </g>
  <text x="85" y="1040" font-family="Arial, sans-serif" font-size="9" fill="#9aa5ad">Synthetic document for demonstration only. Page 1 of 3.</text>
